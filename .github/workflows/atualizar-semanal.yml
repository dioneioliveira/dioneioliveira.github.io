name: Atualização semanal do site

on:
  schedule:
    # Toda segunda-feira às 9h (horário de Brasília = 12h UTC)
    - cron: "0 12 * * 1"
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizacao-semanal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar vídeos e inscritos no YouTube
        run: python3 scripts/atualizar.py

      - name: Salvar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- js/auto.js; then
            echo "Nada mudou nesta semana."
            exit 0
          fi
          git config user.name "Atualização automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auto.js
          git commit -m "Atualização semanal: vídeos e inscritos ($(TZ=America/Sao_Paulo date +%d/%m/%Y))"
          git push
          # Pede ao GitHub Pages para publicar a versão nova
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
