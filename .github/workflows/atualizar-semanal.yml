name: Atualização automática do site

on:
  schedule:
    # Acorda todo dia às 9h (horário de Brasília = 12h UTC); o passo "Dia de atualizar?"
    # deixa seguir só em dias alternados, então o site atualiza a cada 2 dias.
    - cron: "0 12 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora (ignora o intervalo de 2 dias)

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizacao-automatica
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Dia de atualizar?
        id: dia
        run: |
          # Conta os dias desde 01/01/1970: atualiza nos dias pares, ou seja, a cada 2 dias certinho
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Hoje não é dia de atualizar (roda a cada 2 dias)."
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dia.outputs.rodar == 'sim'

      - uses: actions/setup-python@v5
        if: steps.dia.outputs.rodar == 'sim'
        with:
          python-version: "3.12"

      - name: Buscar vídeos e inscritos no YouTube
        if: steps.dia.outputs.rodar == 'sim'
        run: python3 scripts/atualizar.py

      - name: Salvar e publicar
        if: steps.dia.outputs.rodar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- js/auto.js; then
            echo "Nada mudou desde a última atualização."
            exit 0
          fi
          git config user.name "Atualização automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auto.js
          git commit -m "Atualização automática: vídeos, inscritos e loja ($(TZ=America/Sao_Paulo date +%d/%m/%Y))"
          git push
          # Pede ao GitHub Pages para publicar a versão nova
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
